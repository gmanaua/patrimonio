# Daily closing prices for the dashboard. Publishes precios.json (prices only, no holdings) to the "precios" branch,
# which index.html reads from raw.githubusercontent.com. A separate branch keeps sync.js's force-pushed data commit on main untouched.
name: Precios
on:
  schedule:
    - cron: '0 7 * * 2-6'     # fund NAVs of the previous day (published overnight)
    - cron: '45 16 * * 1-5'   # after Xetra / BME close (17:30 CET)
    - cron: '30 21 * * 1-5'   # after the US close (16:00 ET)
  workflow_dispatch:
permissions:
  contents: write
concurrency: precios
jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin precios && git show origin/precios:precios.json > anterior.json || echo '{}' > anterior.json
      - run: node precios.js anterior.json > precios.json
      - run: |
          mkdir out && mv precios.json out/ && cd out
          git init -q -b precios && git add precios.json
          git -c user.name=github-actions -c user.email=41898209+github-actions[bot]@users.noreply.github.com commit -qm Precios
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" precios
